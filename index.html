<!DOCTYPE html><html><head><title>Ad</title></head><body style="text-align:center;"><h2>16s Auto Ad</h2><p>Time: <span id="t">16</span>s | Coins: <span id="c">0</span></p><button id="b" onclick="go()">Start</button><script>let r=false,t=16,c=0,i;function go(){let b=document.getElementById("b");if(!r){r=true;b.innerText="Stop";i=setInterval(()=>{t--;document.getElementById("t").innerText=t;if(t<=0){c+=10;document.getElementById("c").innerText=c;t=16;}},1000);}else{r=false;clearInterval(i);t=16;document.getElementById("t").innerText=t;b.innerText="Start";}}</script></body></html>
